<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natación BA - Galería Multimedia</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ajuste para que el iframe de YouTube cubra toda la pantalla sin barras negras */
        .video-background {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* Relación de aspecto 16:9 */
            min-height: 100vh;
            min-width: 177.77vh; /* 16/9 en alto */
            transform: translate(-50%, -50%);
            pointer-events: none; /* Evita interacción para no interferir con el scroll */
            z-index: -2;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden">

  <!-- 1. VIDEO DE FONDO (Archivo local de la carpeta video) -->
<div class="video-background">
    <video autoplay loop muted playsinline class="w-full h-full object-cover">
        <!-- Reemplaza ".mp4" por el nombre real de tu archivo -->
        <source src="videoFondo/natatorio olímpico.mp4" type="video/mp4">
        Tu navegador no soporta videos en HTML5.
    </video>
</div>

    <!-- 2. CAPA SUPERPUESTA (Overlay oscuro para legibilidad) -->
    <div class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm -z-10"></div>

    <!-- 3. CONTENIDO PRINCIPAL -->
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏊‍♂️</span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-blue-400">Natación BA</h1>
                    <p class="text-xs text-slate-400">Natatorio Olímpico Parque Roca</p>
                </div>
            </div>
            
            <!-- Buscador y Filtros -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <input 
                    type="text" 
                    id="search-swimmer" 
                    placeholder="Buscar por nadador..." 
                    class="bg-slate-900/90 border border-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none w-full sm:w-48 text-white placeholder-slate-400"
                >
                <select 
                    id="filter-tournament" 
                    class="bg-slate-900/90 border border-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none w-full sm:w-56 text-white"
                >
                    <option value="">Todos los Torneos</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Galería Grid con tarjetas semi-transparentes -->
        <div id="media-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Renderizado dinámico vía JS (app.js) -->
        </div>

        <!-- Estado Vacío -->
        <div id="empty-state" class="hidden text-center py-16 bg-slate-900/60 rounded-xl border border-slate-800 backdrop-blur-md">
            <p class="text-slate-300 text-lg">No se encontraron fotos o videos con los filtros seleccionados.</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
