<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natación BA - Galería Multimedia</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* CSS limpio para Video de Fondo en HTML5 */
        .video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2;
        }

        .video-bg-container video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 23, 0.75); /* Slate 950 al 75% */
            backdrop-filter: blur(4px);
            z-index: -1;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden">

    <!-- 1. CONTENEDOR DEL VIDEO DE FONDO -->
    <div class="video-bg-container">
        <video autoplay loop muted playsinline preload="auto">
            <source src="./videoFondo/natatorio.mp4" type="video/mp4">
            Tu navegador no soporta videos en HTML5.
        </video>
    </div>

    <!-- 2. CAPA SUPERPUESTA (Overlay de oscurecimiento) -->
    <div class="video-overlay"></div>

    <!-- 3. CONTENIDO PRINCIPAL DE LA PÁGINA -->
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏊‍♂️</span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-blue-400">Natación BA</h1>
                    <p class="text-xs text-slate-400">Natatorio Olímpico Parque Roca</p>
                </div>
            </div>
            
            <!-- Buscador y Filtros -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <input 
                    type="text" 
                    id="search-swimmer" 
                    placeholder="Buscar por nadador..." 
                    class="bg-slate-900/90 border border-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none w-full sm:w-48 text-white placeholder-slate-400"
                >
                <select 
                    id="filter-tournament" 
                    class="bg-slate-900/90 border border-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none w-full sm:w-56 text-white"
                >
                    <option value="">Todos los Torneos</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        <!-- Galería Grid -->
        <div id="media-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Renderizado dinámico vía JS -->
        </div>

        <!-- Estado Vacío -->
        <div id="empty-state" class="hidden text-center py-16 bg-slate-900/60 rounded-xl border border-slate-800 backdrop-blur-md">
            <p class="text-slate-300 text-lg">No se encontraron fotos o videos con los filtros seleccionados.</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const bgVideo = document.querySelector('.video-bg-container video');
        if (bgVideo) {
            // Asegura que esté silenciado para cumplir con la política de Autoplay
            bgVideo.muted = true;
            
            // Intenta reproducir explícitamente por JS
            const playPromise = bgVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay bloqueado o fallo de códec:", error);
                });
            }
        }
    });
</script>
</body>
</html>
