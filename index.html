<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natación BA - Galería Multimedia</title>
    <!-- Tailwind CSS desde CDN para diseño moderno y rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<bg-slate-900 class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏊‍♂️</span>
                <h1 class="text-2xl font-bold tracking-tight text-blue-400">Natación BA</h1>
            </div>
            
            <!-- Buscador y Filtros -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <input 
                    type="text" 
                    id="search-swimmer" 
                    placeholder="Buscar por nadador..." 
                    class="bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none w-full sm:w-48"
                >
                <select 
                    id="filter-tournament" 
                    class="bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none w-full sm:w-56"
                >
                    <option value="">Todos los Torneos</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Galería Grid -->
        <div id="media-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Renderizado dinámico vía JS -->
        </div>

        <!-- Estado Vacío -->
        <div id="empty-state" class="hidden text-center py-16">
            <p class="text-slate-400 text-lg">No se encontraron fotos o videos con los filtros seleccionados.</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
